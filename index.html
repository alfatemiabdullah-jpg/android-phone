<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الهاتف الذكي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .phone-container {
            width: 100%;
            max-width: 375px;
            background: #000;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .notch {
            height: 28px;
            background: #000;
            border-radius: 0 0 20px 20px;
            margin: 0 auto;
            width: 150px;
            position: relative;
            z-index: 10;
        }

        .screen {
            width: 100%;
            height: 812px;
            background: linear-gradient(180deg, #f5f5f5 0%, #ffffff 100%);
            border-radius: 35px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .status-bar {
            height: 44px;
            background: #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid #e0e0e0;
        }

        .status-left, .status-right {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            gap: 30px;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .welcome-text {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #333;
            line-height: 1.4;
        }

        .subtitle {
            text-align: center;
            font-size: 16px;
            color: #666;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 280px;
        }

        button {
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.98);
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .btn-secondary:active {
            background: #e0e0e0;
            transform: scale(0.98);
        }

        .features {
            width: 100%;
            padding: 0 20px;
            margin-bottom: 30px;
        }

        .feature-item {
            background: #f9f9f9;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .feature-icon {
            font-size: 24px;
            min-width: 30px;
        }

        .feature-text {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        .home-indicator {
            height: 34px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 8px;
        }

        .home-indicator-bar {
            width: 134px;
            height: 4px;
            background: #000;
            border-radius: 2px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 300px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .modal-content p {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .modal-close {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .modal-close:active {
            transform: scale(0.98);
        }

        .counter-display {
            font-size: 18px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="notch"></div>
        <div class="screen">
            <div class="status-bar">
                <div class="status-left">
                    <span>🔋</span>
                </div>
                <div style="font-weight: 700;">9:41</div>
                <div class="status-right">
                    <span>📶</span>
                </div>
            </div>

            <div class="content">
                <div class="app-icon">📱</div>
                
                <div class="welcome-text" id="welcomeText">
                    مرحبا بك في<br>تطبيق الهاتف الذكي
                </div>

                <div class="subtitle">
                    تطبيق عصري وسهل الاستخدام
                </div>

                <div class="features">
                    <div class="feature-item">
                        <div class="feature-icon">⚡</div>
                        <div class="feature-text">سريع وخفيف الوزن</div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">🎨</div>
                        <div class="feature-text">واجهة مستخدم جميلة</div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">🔒</div>
                        <div class="feature-text">آمن وموثوق</div>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn-primary" onclick="showWelcome()">ابدأ الآن</button>
                    <button class="btn-secondary" onclick="openModal()">المزيد من المعلومات</button>
                </div>
            </div>

            <div class="home-indicator">
                <div class="home-indicator-bar"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="infoModal">
        <div class="modal-content">
            <h2>معلومات التطبيق 📱</h2>
            <p>هذا تطبيق هاتف ذكي حديث مكتوب بـ HTML و CSS و JavaScript</p>
            <div class="counter-display" id="counterDisplay">تم النقر 0 مرة</div>
            <button class="modal-close" onclick="closeModal()">حسناً</button>
        </div>
    </div>

    <script>
        let clickCount = 0;

        function showWelcome() {
            const welcomeText = document.getElementById('welcomeText');
            welcomeText.style.transition = 'all 0.3s ease';
            welcomeText.textContent = 'تم النقر على الزر! 🎉';
            setTimeout(() => {
                welcomeText.textContent = 'مرحبا بك في\nتطبيق الهاتف الذكي';
            }, 2000);
        }

        function openModal() {
            clickCount++;
            document.getElementById('counterDisplay').textContent = `تم النقر ${clickCount} مرة`;
            document.getElementById('infoModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.remove('active');
        }

        // Close modal when clicking outside
        document.getElementById('infoModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
